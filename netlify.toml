# Build-time env: set `VITE_CONVEX_URL` in Netlify to your Convex deployment URL (see README → Deployment).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"

# Redirect apex domain traffic to /beta-access.
[[redirects]]
  from = "https://letthink.co/*"
  to = "https://letthink.co/beta-access"
  status = 301

# Client-side routing (TanStack Router): serve index.html for deep links and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
