# Build-time env: set `VITE_CONVEX_URL` in Netlify to your Convex deployment URL (see README → Deployment).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"

# Redirect legacy beta links to the root landing page.
[[redirects]]
  from = "/beta-access"
  to = "/"
  status = 301

# Client-side routing (TanStack Router): serve index.html for deep links and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
